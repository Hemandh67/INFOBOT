{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>My Dashboard</h2>
    <a href="{% url 'add_notice' %}" class="btn btn-success">+ Add New Notice</a>
</div>

<div class="card">
    <div class="card-body">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Category</th>
                    <th>Date Posted</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for notice in notices %}
                <tr>
                    <td><a href="{% url 'notice_detail' notice.pk %}">{{ notice.title }}</a></td>
                    <td>{{ notice.category }}</td>
                    <td>{{ notice.date_posted|date:"M d, Y" }}</td>
                    <td>
                        <a href="{% url 'edit_notice' notice.pk %}" class="btn btn-sm btn-warning">Edit</a>
                        <a href="{% url 'delete_notice' notice.pk %}" class="btn btn-sm btn-danger"
                            onclick="return confirm('Are you sure?');">Delete</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4" class="text-center">No notices posted yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
