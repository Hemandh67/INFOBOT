{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-warning text-dark">Edit Notice</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control" value="{{ notice.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select" required>
                            <option value="General" {% if notice.category=='General' %}selected{% endif %}>General
                            </option>
                            <option value="Exam" {% if notice.category=='Exam' %}selected{% endif %}>Exam</option>
                            <option value="Event" {% if notice.category=='Event' %}selected{% endif %}>Event</option>
                            <option value="Placement" {% if notice.category=='Placement' %}selected{% endif %}>Placement
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="5"
                            required>{{ notice.description }}</textarea>
                    </div>

                    <button type="submit" class="btn btn-warning">Update Notice</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
