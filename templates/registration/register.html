{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="premium-card p-5">
            <h2 class="text-center fw-bold mb-4" style="color: var(--text-main);">Create Student Account</h2>
            <p class="text-center text-muted mb-4">Register to access college notices</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-premium btn-lg">Register</button>
                    <p class="text-center mt-3 text-muted">Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
